<!DOCTYPE html>
<html>
<head>
<title>AI WISPHOT v9.2 - DHUAN + TG</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;margin:0;font-family:Arial;text-align:center;padding:20px}
h2{color:#0f8}
#sig{font-size:22px;font-weight:bold;margin:15px;padding:20px;border-radius:10px;line-height:1.6}
.dhuan{background:#ffcc00;color:#000;font-size:24px}
.wisphot{background:#ff0;color:#000;font-size:28px;animation:blink 0.5s infinite;border:3px solid #ff0}
.hold{background:#555;color:#fff}
@keyframes blink{50%{opacity:0.3}}
button{padding:12px 25px;background:#0f8;border:none;color:#000;font-weight:bold;cursor:pointer;border-radius:8px;font-size:16px}
select{padding:10px;margin:10px;font-size:16px;border-radius:8px;background:#222;color:#fff;border:1px solid #0f8;width:90%;max-width:400px}
#tvchart{height:500px;margin-top:20px;border-radius:10px;overflow:hidden}
.small{font-size:14px;color:#aaa}
</style>
</head>
<body>
<h2>🚀 AI WISPHOT v9.2 - धुआं + विस्फोट + TELEGRAM</h2>

<select id="symbol" onchange="loadChart()">
  <option value="BINANCE:BTCUSDT">Bitcoin BTC</option>
  <option value="BINANCE:ETHUSDT">Ethereum ETH</option>
  <option value="OANDA:XAUUSD">Gold</option>
  <option value="OANDA:XAGUSD">Silver</option>
</select>

<div id="sig">AI SCANNING FOR DHUAN...</div>
<button onclick="checkWisphot()">💥 स्कैन शुरू करो</button>
<div class="small">टेलीग्राम अलर्ट ऑन है</div>

<div id="tvchart"></div>

<script>
// ====== यहाँ अपना TOKEN और CHAT ID डालो ======
const BOT_TOKEN = "PASTE_YOUR_BOT_TOKEN_HERE";
const CHAT_ID = "PASTE_YOUR_CHAT_ID_HERE";
// ==============================================

let currentSymbol = "BINANCE:BTCUSDT";
const API_KEY = "P48NXOJZ54SA4TXL";
let lastAlert = ""; // डुप्लीकेट अलर्ट रोकने के लिए

function loadChart(){
  currentSymbol = document.getElementById('symbol').value;
  document.getElementById('tvchart').innerHTML = '';
  new TradingView.widget({"container_id": "tvchart", "width": "100%", "height": 500, "symbol": currentSymbol, "interval": "5", "timezone": "Asia/Kolkata", "theme": "dark", "style": "1", "toolbar_bg": "#222", "locale": "en"});
}

async function getIndicator(func, symbol){
  let url = `https://www.alphavantage.co/query?function=${func}&symbol=${symbol}&interval=5min&apikey=${API_KEY}`;
  let res = await fetch(url);
  return await res.json();
}

// टेलीग्राम मैसेज भेजने वाला फंक्शन
function sendTelegram(msg){
  if(msg == lastAlert) return; // 2 बार same अलर्ट मत भेजो
  lastAlert = msg;
  let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;
  fetch(url);
}

async function checkWisphot(){
  document.getElementById('sig').innerText = 'AI SCANNING 4 INDICATORS...';
  let sym = currentSymbol.split(':')[1].replace('USDT','').replace('USD','');
  if(sym == 'BTC') sym = 'BTC'; if(sym == 'ETH') sym = 'ETH';
  if(sym == 'XAU') sym = 'XAUUSD'; if(sym == 'XAG') sym = 'XAGUSD';

  try{
    let [rsiD, macdD, bbD, volD] = await Promise.all([
      getIndicator('RSI', sym), getIndicator('MACD', sym),
      getIndicator('BBANDS', sym), getIndicator('VOLUME', sym)
    ]);

    let times = Object.keys(rsiD["Technical Analysis: RSI"]).slice(0,20);
    let rsiValues = times.map(t => parseFloat(rsiD["Technical Analysis: RSI"][t]["RSI"])).reverse();
    let rsi = rsiValues[rsiValues.length-1];

    let macd = parseFloat(macdD["Technical Analysis: MACD"][times[0]]["MACD"]);
    let macdSignal = parseFloat(macdD["Technical Analysis: MACD"][times[0]]["MACD_Signal"]);

    let bb = bbD["Technical Analysis: BBANDS"][times[0]];
    let bbUpper = parseFloat(bb["Real Upper Band"]);
    let bbLower = parseFloat(bb["Real Lower Band"]);
    let price = parseFloat(bb["Real Middle Band"]);
    let bbWidth = bbUpper - bbLower;
    let avgWidth = (bbUpper - bbLower + bbD["Technical Analysis: BBANDS"][times[5]]["Real Upper Band"] - bbD["Technical Analysis: BBANDS"][times[5]]["Real Lower Band"]) / 2;
    let isSqueezing = bbWidth < avgWidth * 0.7;

    let vols = times.map(t => parseFloat(volD["Technical Analysis: VOLUME"][t]["volume"])).reverse();
    let currentVol = vols[vols.length-1];
    let avgVol = vols.reduce((a,b)=>a+b)/vols.length;
    let isVolSpike = currentVol > avgVol * 1.8;

    let buyScore = 0, sellScore = 0;
    if(rsi < 30) buyScore++; if(rsi > 70) sellScore++;
    if(macd > macdSignal) buyScore++; if(macd < macdSignal) sellScore++;
    if(price <= bbLower) buyScore++; if(price >= bbUpper) sellScore++;
    if(buyScore >= 2 || sellScore >= 2) { if(isVolSpike) {buyScore++; sellScore++;} }

    // 1. DHUAN LOGIC - 1-2 मिनट पहले
    let smokeScore = 0;
    if(isSqueezing) smokeScore++;
    if(isVolSpike) smokeScore++;
    if(rsiValues[rsiValues.length-1] > rsiValues[rsiValues.length-3] && price < parseFloat(bbD["Technical Analysis: BBANDS"][times[3]]["Real Middle Band"])) smokeScore++;

    let alertMsg = "";
    if(smokeScore >= 2 && buyScore >= 2){
      alertMsg = `🌋 DHUAN ALERT!\n${sym} में विस्फोट 1-2 मिनट में संभव\nतैयार रहो! SL: ${(price*0.985).toFixed(2)}`;
      document.getElementById('sig').innerHTML = alertMsg.replace('\n','<br>');
      document.getElementById('sig').className = 'dhuan';
    }

    // 2. WISPHOT LOGIC - अभी
    if(buyScore >= 4){
      alertMsg = `💥💥 WISPHOT NOW! 💥💥\nSTRONG BUY: ${sym}\n4/4 CONFIRMED\nRSI:${rsi.toFixed(1)}\nSL:${(price*0.985).toFixed(2)} | TP:${(price*1.06).toFixed(2)}`;
      document.getElementById('sig').innerHTML = alertMsg.replace('\n','<br>');
      document.getElementById('sig').className = 'wisphot';
    } else if(sellScore >= 4){
      alertMsg = `💥💥 WISPHOT CRASH! 💥💥\nSTRONG SELL: ${sym}\n4/4 CONFIRMED\nRSI:${rsi.toFixed(1)}\nSL:${(price*1.015).toFixed(2)} | TP:${(price*0.94).toFixed(2)}`;
      document.getElementById('sig').innerHTML = alertMsg.replace('\n','<br>');
      document.getElementById('sig').className = 'wisphot';
    } else if(!alertMsg) {
      document.getElementById('sig').innerHTML = `WAIT<br>Buy:${buyScore}/4 | Sell:${sellScore}/4 | Dhuan:${smokeScore}/3`;
      document.getElementById('sig').className = 'hold';
    }

    if(alertMsg) sendTelegram(alertMsg);

  } catch(e){
    document.getElementById('sig').innerText = `ERROR: API Limit। 2 मिनट रुको`;
  }
}
window.onload = ()=> { loadChart(); checkWisphot(); setInterval(checkWisphot, 120000); }
</script>
</body>
</html>
